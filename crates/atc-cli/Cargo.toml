[package]
name = "atc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tower: project management for people and agents, built on fufu"
publish = false

# One binary, one name.
[[bin]]
name = "atc"
path = "src/main.rs"

[dependencies]
atc-core.workspace = true
atc-serve.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anstyle.workspace = true
anstream.workspace = true
ureq.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
atc-testsupport.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
