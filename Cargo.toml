[workspace]
resolver = "3"
members = [
    "crates/ff-tower-core",
    "crates/ff-tower-cli",
    "crates/ff-tower-serve",
    "crates/ff-tower-testsupport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tyler-johnson/tower"

[workspace.dependencies]
ff-tower-core = { path = "crates/ff-tower-core" }
ff-tower-serve = { path = "crates/ff-tower-serve" }
ff-tower-testsupport = { path = "crates/ff-tower-testsupport" }

# For tower's own store, and for nothing else. `refs/tower/log/<author>/<writer>`
# is an orphan commit chain tower writes itself; everything tower knows about
# the repository comes from `ff <verb> --json` instead. The feature set is
# deliberately thin and will grow with the store rather than ahead of it.
gix = { version = "0.73.0", default-features = false, features = [
    "max-performance-safe",
    "revision",
] }
serde = { version = "1", features = ["derive"] }
# `raw_value` is the seam's: the envelope's version and verb are checked
# before its payload is parsed, so `data` has to survive one pass
# unparsed. See crates/ff-tower-core/src/ff/mod.rs.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "1"
# Procedures are TOML: structure as data, with the judgment beside it in
# markdown. See DESIGN.md, "Procedures — Shape".
toml = "0.9"
tempfile = "3"
# The self-update stack, fufu's exactly: ureq over rustls is tower's first
# and only TLS, and the deny.toml exceptions it needs are already carried.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# `ff tower serve`, and nothing else. One route over HTTP/1.1 on the
# loopback needs routing and a listener; it needs no tracing, no
# multipart, no compression, so the default set is off and the two
# features the server actually reaches for are named. Note that axum's own
# tree carries crates named `tower`, `tower-layer`, and `tower-service` —
# Rust's service abstraction, no relation to this project. `cargo tree` in
# this repository is ambiguous by accident, and reading a `tower` line
# there as ours is the mistake to expect.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
] }
# The runtime under axum, and tower's first async anything. Named
# feature by feature rather than `full`: worker threads for the server,
# sockets to bind, the signal handler Ctrl-C arrives on, the macros the
# async plumbing is written with, and the change feed's four — the watch
# channel and dirty flag (sync), the debounce timer (time), the watch
# child (process), and its line reader (io-util).
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "signal",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
] }
# The change feed's filesystem half: one watcher over the tower log refs
# and packed-refs. Defaults off drops the crossbeam channel the callback
# API never uses; the inotify and Windows backends are not feature-gated,
# and `macos_fsevent` names the mac one. CC0-1.0 rides in its tree and
# deny.toml already allows it.
notify = { version = "8", default-features = false, features = [
    "macos_fsevent",
] }
# `ReceiverStream` alone: the adapter that turns a feed subscriber's
# frame channel into the stream axum's SSE response wants.
tokio-stream = { version = "0.1", default-features = false, features = [
    "sync",
] }
# The web build, embedded whole: build.rs runs the SvelteKit build and
# stages it in OUT_DIR, and this compiles that tree into the binary.
# Chosen over rust-embed: it always embeds regardless of profile, has no
# runtime read-from-disk mode to accidentally ship, and its build-dep
# tree is smaller. MIT, already on deny.toml's allowlist.
include_dir = "0.7"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Local dogfood builds: release semantics without the LTO link cost. A
# separate target dir (target/dogfood), so it never thrashes the pristine
# fat-LTO target/release. `make install` symlinks the binary here, and
# strip stays off so a panic in daily use names its own line.
[profile.dogfood]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = false
