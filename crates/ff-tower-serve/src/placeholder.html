<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tower</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b1b1b;
        --dim: #6b6b6b;
        --page: #fbfbfa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8e6e3;
          --dim: #8d8a86;
          --page: #17181a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 34rem;
        padding: 2rem;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>tower is serving</h1>
      <p>
        The board is not here yet. This process is the standing one the
        browser story mounts into — a clock and a subscriber, holding no
        state the log does not.
      </p>
      <p>Ctrl-C ends it. Every other interface works without it.</p>
    </main>
  </body>
</html>
