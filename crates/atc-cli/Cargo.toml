[package]
name = "atc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tower: project management for people and agents, built on fufu"
publish = false

# One binary, one name.
[[bin]]
name = "atc"
path = "src/main.rs"

[dependencies]
atc-core.workspace = true
atc-serve.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anstyle.workspace = true
anstream.workspace = true
ureq.workspace = true
sha2.workspace = true

[dev-dependencies]
atc-testsupport.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# The Documents known folder, for PowerShell's profile: `$PROFILE` follows
# a OneDrive redirect, and only the shell API says where it went.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
