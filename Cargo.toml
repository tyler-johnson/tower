[workspace]
resolver = "3"
members = ["crates/tower-core", "crates/tower-cli", "crates/tower-testsupport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tyler-johnson/tower"

[workspace.dependencies]
tower-core = { path = "crates/tower-core" }
tower-testsupport = { path = "crates/tower-testsupport" }

# For tower's own store, and for nothing else. `refs/tower/log/<author>` is
# an orphan commit chain tower writes itself; everything tower knows about
# the repository comes from `ff <verb> --json` instead. The feature set is
# deliberately thin and will grow with the store rather than ahead of it.
gix = { version = "0.73.0", default-features = false, features = [
    "max-performance-safe",
    "revision",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "1"
# Procedures are TOML: structure as data, with the judgment beside it in
# markdown. See DESIGN.md, "Procedures — Shape".
toml = "0.9"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
