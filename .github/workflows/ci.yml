name: ci

# One test job per operating system, unsharded. fufu shards Windows four
# ways because its suite spawns a real `git` per assertion and Windows
# charges 6.6ms a process; tower's suite is small and spawn-light, so
# shards would cost more in runner minutes and cache budget than they buy.
# Shard a leg only when it is measured to gate the run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # The fufu commit the seam is built against.
      FUFU_REV: 0c4ab63f
    steps:
      - uses: actions/checkout@v7

      # Worth 1.1x-1.7x on fufu's suite, measured there; tower inherits the
      # win because its fixtures also spawn real `git` and `ff`. It goes
      # before the cache restores so that unpacking the target directory is
      # not scanned either.
      - name: Exclude the build from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "git.exe"

      # build.rs runs the web build inside cargo, so every cargo step —
      # clippy compiles build scripts too — needs pnpm and Node first.
      # The pnpm version comes from web/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # No shared-key or save-if: the default key already includes the OS,
      # and with one job per OS there is nothing to share.
      - uses: Swatinem/rust-cache@v2
      - name: cache fufu
        id: fufu
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/ff
            ~/.cargo/bin/ff.exe
          key: fufu-${{ runner.os }}-${{ env.FUFU_REV }}
      - name: install fufu
        # The suite runs against a real `ff` — mocking it away would pass
        # against a contract that had moved. Built from source at a pinned
        # commit rather than pulled from a release: tower tracks fufu's main
        # between releases (the one-pair `ff collide` landed after v0.8.0),
        # so the pin is a rev, cached above, bumped when the seam moves.
        if: steps.fufu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --git https://github.com/tyler-johnson/fufu --rev "$FUFU_REV" --locked ff-cli
          ff --version

      # The web checks need the dependencies before cargo's build script would have installed them.
      - if: runner.os == 'Linux'
        run: pnpm --dir web install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        run: pnpm --dir web format-check
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: pnpm --dir web lint
      - run: cargo test --workspace

      # The installers can't run in CI, but they can at least parse.
      - if: runner.os == 'Linux'
        run: sh -n install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }
