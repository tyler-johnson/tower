name: ci

# Deliberately one platform and one test job. fufu's matrix is sharded four
# ways across three operating systems because its suite spawns a real `git`
# per assertion and Windows charges 6.6ms a process; tower's suite is small
# and has no measured reason for any of that. Widen this when there is
# something to widen it for.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    runs-on: ubuntu-latest
    env:
      # The fufu commit the seam is built against.
      FUFU_REV: 2c861094
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cache fufu
        id: fufu
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ff
          key: fufu-${{ env.FUFU_REV }}
      - name: install fufu
        # The suite runs against a real `ff` — mocking it away would pass
        # against a contract that had moved. Built from source at a pinned
        # commit rather than pulled from a release: tower tracks fufu's main
        # between releases (the one-pair `ff collide` landed after v0.8.0),
        # so the pin is a rev, cached above, bumped when the seam moves.
        if: steps.fufu.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/tyler-johnson/fufu --rev "$FUFU_REV" --locked ff-cli
          ff --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
