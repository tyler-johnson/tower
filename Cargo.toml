[workspace]
resolver = "3"
members = [
    "crates/ff-tower-core",
    "crates/ff-tower-cli",
    "crates/ff-tower-testsupport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tyler-johnson/tower"

[workspace.dependencies]
ff-tower-core = { path = "crates/ff-tower-core" }
ff-tower-testsupport = { path = "crates/ff-tower-testsupport" }

# For tower's own store, and for nothing else. `refs/tower/log/<author>/<writer>`
# is an orphan commit chain tower writes itself; everything tower knows about
# the repository comes from `ff <verb> --json` instead. The feature set is
# deliberately thin and will grow with the store rather than ahead of it.
gix = { version = "0.73.0", default-features = false, features = [
    "max-performance-safe",
    "revision",
] }
serde = { version = "1", features = ["derive"] }
# `raw_value` is the seam's: the envelope's version and verb are checked
# before its payload is parsed, so `data` has to survive one pass
# unparsed. See crates/ff-tower-core/src/ff/mod.rs.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "1"
# Procedures are TOML: structure as data, with the judgment beside it in
# markdown. See DESIGN.md, "Procedures — Shape".
toml = "0.9"
tempfile = "3"
# The self-update stack, fufu's exactly: ureq over rustls is tower's first
# and only TLS, and the deny.toml exceptions it needs are already carried.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Local dogfood builds: release semantics without the LTO link cost. A
# separate target dir (target/dogfood), so it never thrashes the pristine
# fat-LTO target/release. `make install` symlinks the binary here, and
# strip stays off so a panic in daily use names its own line.
[profile.dogfood]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = false
