name: ci

# One test job per operating system, unsharded. fufu shards Windows four
# ways because its suite spawns a real `git` per assertion and Windows
# charges 6.6ms a process; tower's suite is small and spawn-light, so
# shards would cost more in runner minutes and cache budget than they buy.
# Shard a leg only when it is measured to gate the run.

on:
  push:
    branches: [main]
  pull_request:

env:
  # The fufu commit the seam is built against.
  FUFU_REV: 0c4ab63f

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Worth 1.1x-1.7x on fufu's suite, measured there; tower inherits the
      # win because its fixtures also spawn real `git` and `ff`. It goes
      # before the cache restores so that unpacking the target directory is
      # not scanned either.
      - name: Exclude the build from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "git.exe"

      # build.rs runs the web build inside cargo, so every cargo step —
      # clippy compiles build scripts too — needs pnpm and Node first.
      # The pnpm version comes from web/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # No shared-key or save-if: the default key already includes the OS,
      # and with one job per OS there is nothing to share.
      - uses: Swatinem/rust-cache@v2
      - name: cache fufu
        id: fufu
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/ff
            ~/.cargo/bin/ff.exe
          key: fufu-${{ runner.os }}-${{ env.FUFU_REV }}
      - name: install fufu
        # The suite runs against a real `ff` — mocking it away would pass
        # against a contract that had moved. Built from source at a pinned
        # commit rather than pulled from a release: tower tracks fufu's main
        # between releases (the one-pair `ff collide` landed after v0.8.0),
        # so the pin is a rev, cached above, bumped when the seam moves.
        if: steps.fufu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --git https://github.com/tyler-johnson/fufu --rev "$FUFU_REV" --locked ff-cli
          ff --version

      # The web checks need the dependencies before cargo's build script would have installed them.
      - if: runner.os == 'Linux'
        run: pnpm --dir web install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        run: pnpm --dir web format-check
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: pnpm --dir web lint
      - run: cargo test --workspace

      # The installers can't run in CI, but they can at least parse.
      - if: runner.os == 'Linux'
        run: sh -n install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }

  # One job per agent client tower wires, running that client's live suite
  # against the real binary: `tests/live_<client>.rs`, which asks the
  # client what it loaded after `atc hook` and runs a headless session
  # against the scripted mock model. Linux only — the client is the
  # variable, not the OS. Each client is pinned so a bump is a deliberate
  # commit and the matrix names what it broke. `ATC_LIVE` turns a missing
  # binary from a skip into a failure, so an install that failed cannot
  # pass by skipping; `--nocapture` puts the client's own output in the
  # log when it fails. The `test` job still compiles these suites and
  # skips them: no binary, no `ATC_LIVE`. Copilot, Cursor, and OpenCode
  # rows come with #157, #158, and #150.
  live:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { client: codex, package: "@openai/codex@0.154.0" }
          - { client: claude, package: "@anthropic-ai/claude-code@2.1.270" }
          - { client: qwen, package: "@qwen-code/qwen-code@0.23.3" }
    name: live (${{ matrix.client }})
    runs-on: ubuntu-latest
    env:
      ATC_LIVE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      # The three rows build the same target directory; one saves it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live
          save-if: ${{ matrix.client == 'codex' }}
      - name: cache fufu
        id: fufu
        uses: actions/cache@v6
        with:
          # The same paths as `test`'s, so the two jobs share the entry.
          path: |
            ~/.cargo/bin/ff
            ~/.cargo/bin/ff.exe
          key: fufu-${{ runner.os }}-${{ env.FUFU_REV }}
      - name: install fufu
        if: steps.fufu.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/tyler-johnson/fufu --rev "$FUFU_REV" --locked ff-cli
          ff --version
      - name: install ${{ matrix.client }}
        run: |
          npm i -g ${{ matrix.package }}
          ${{ matrix.client }} --version
      - run: cargo test -p atc-cli --test live_${{ matrix.client }} -- --nocapture
